name: Pages Deployment (After Bundle)

on:
  workflow_run:
    workflows: ["Create Unified Bundle"]
    types:
      - completed

permissions:
  pages: write
  id-token: write

jobs:
  deploy-pages:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
