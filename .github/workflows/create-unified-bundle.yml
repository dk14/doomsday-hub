name: Create Unified Bundle

on:
  push:
    branches:
      - main
  repository_dispatch:
    types: [repo_updated]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout doomsday-hub to root
        uses: actions/checkout@v4

      - name: Checkout crypto repo
        uses: actions/checkout@v4
        with:
          repository: dk14/crypto
          path: bundle/crypto

      - name: Checkout q repo
        uses: actions/checkout@v4
        with:
          repository: dk14/q
          path: bundle/q

      - name: Checkout warriors repo
        uses: actions/checkout@v4
        with:
          repository: dk14/warriors
          path: bundle/warriors

      - name: Checkout doomsday-website repo
        uses: actions/checkout@v4
        with:
          repository: dk14/doomsday-website
          path: bundle/doomsday-website

      - name: Checkout mega-peers repo
        uses: actions/checkout@v4
        with:
          repository: dk14/mega-peers
          path: bundle/mega-peers

      - name: Create unified zip archive (full)
        run: |
          cd bundle
          zip -r ../doomsday-unified-bundle.zip . -x "*/.*" "*/node_modules/*" "*/__pycache__/*" "*/dist/*" "*/build/*" "*.mp4"
          cd ..
          ls -lh doomsday-unified-bundle.zip

      - name: Create minified zip archive (no media)
        run: |
          cd bundle
          zip -r ../doomsday-unified-bundle-minified.zip . -x "*/.*" "*/node_modules/*" "*/__pycache__/*" "*/dist/*" "*/build/*" "*.mp4" "*.mp3" "*.wav" "*.png" "*.jpg" "*.jpeg" "*.gif" "*.webp" "*.svg" "*.ico"
          cd ..
          ls -lh doomsday-unified-bundle-minified.zip

      - name: Create markdown-only zip archive
        run: |
          cd bundle
          zip -r ../doomsday-unified-bundle-docs.zip . -x "*/.*" "*/node_modules/*" "*/__pycache__/*" "*/dist/*" "*/build/*" "*.mp4" "*.mp3" "*.wav" "*.png" "*.jpg" "*.jpeg" "*.gif" "*.webp" "*.svg" "*.ico" "*.js" "*.ts" "*.py" "*.java" "*.go" "*.rs" "*.cpp" "*.c" "*.h" "*.json" "*.yaml" "*.yml" "*.xml" "*.html" --include="*.md" --include="*.txt" --include="*.pdf" --include="*/" -q
          cd ..
          ls -lh doomsday-unified-bundle-docs.zip

      - name: Create unified markdown file
        run: |
          python3 << 'EOF'
          import os
          import re
          from datetime import datetime
          from pathlib import Path
      
          # Define the order and directory mapping
          repos_order = ['crypto', 'doomsday-website', 'warriors', 'q', 'mega-peers']
          
          # File extensions to include
          md_extensions = {'.md'}
          html_extensions = {'.html'}
          code_extensions = {'.js', '.jsx', '.ts', '.tsx'}
      
          def should_include_file(file_path):
              """Check if file should be included in the unified markdown."""
              parts = Path(file_path).parts
              if any(part.startswith('.') for part in parts[:-1]):
                  return False
              if any(part in ['node_modules', '__pycache__', 'dist', 'build'] for part in parts):
                  return False
              
              ext = Path(file_path).suffix.lower()
              return ext in (md_extensions | html_extensions | code_extensions)
      
          def get_file_category(file_path):
              """Determine file category for sorting."""
              ext = Path(file_path).suffix.lower()
              if ext in md_extensions:
                  return 0
              elif ext in html_extensions:
                  return 1
              else:
                  return 2
      
          def escape_code_fence(content):
              """Escape triple backticks in code to prevent fence breaking."""
              return content.replace('```', '`` ` ``')
      
          def escape_liquid_syntax(content):
              """Escape Liquid template syntax to prevent GitHub Pages from processing it."""
              # Wrap content in raw tags if it contains potential Liquid syntax
              if '{{' in content or '{%' in content or '}}' in content or '%}' in content:
                  return f'{{% raw %}}\n{content}\n{{% endraw %}}\n'
              return content
      
          output = []
          output.append("# Doomsday Unified Documentation\n")
          output.append(f"*Generated: {datetime.now().isoformat()}*\n")
          output.append("---\n\n")
      
          bundle_path = Path('bundle')
      
          for repo in repos_order:
              repo_path = bundle_path / repo
              
              if not repo_path.exists():
                  continue
              
              output.append(f"## {repo.upper()}\n\n")
              
              files = []
              for root, dirs, filenames in os.walk(repo_path):
                  dirs[:] = [d for d in dirs if not d.startswith('.') and d not in ['node_modules', '__pycache__', 'dist', 'build']]
                  
                  for filename in filenames:
                      file_path = os.path.join(root, filename)
                      rel_path = os.path.relpath(file_path, repo_path)
                      
                      if should_include_file(rel_path):
                          files.append((rel_path, file_path, get_file_category(rel_path)))
              
              files.sort(key=lambda x: (x[2], x[0]))
              
              for rel_path, file_path, category in files:
                  try:
                      with open(file_path, 'r', encoding='utf-8', errors='ignore') as f:
                          content = f.read()
                      
                      display_path = rel_path.replace(os.sep, '/')
                      ext = Path(file_path).suffix.lower()
                      
                      if ext in md_extensions:
                          output.append(f"### {display_path}\n\n")
                          # FIX: Escape Liquid syntax in markdown
                          output.append(escape_liquid_syntax(content))
                          output.append("\n\n")
                      elif ext in html_extensions:
                          output.append(f"### {display_path}\n\n")
                          output.append("```html\n")
                          output.append(escape_code_fence(content))
                          output.append("\n```\n\n")
                      else:
                          lang = 'javascript' if ext in {'.js', '.jsx'} else 'typescript'
                          output.append(f"### {display_path}\n\n")
                          output.append(f"```{lang}\n")
                          output.append(escape_code_fence(content))
                          output.append("\n```\n\n")
                  except Exception as e:
                      output.append(f"### {display_path}\n\n*Error reading file: {str(e)}*\n\n")
              
              with open('UNIFIED_DOCS.md', 'w', encoding='utf-8') as f:
                  f.write(''.join(output))
              
              size_mb = os.path.getsize('UNIFIED_DOCS.md') / (1024 * 1024)
              print(f"Created UNIFIED_DOCS.md ({size_mb:.2f} MB)")
          EOF
    
      - name: Create releases folder and copy zips
        run: |
          mkdir -p releases
          cp doomsday-unified-bundle.zip releases/
          cp doomsday-unified-bundle-minified.zip releases/
          cp doomsday-unified-bundle-docs.zip releases/
          cp UNIFIED_DOCS.md releases/

      - name: Commit and push zips to repository
        run: |
          git config user.email "dk14@github.com"
          git config user.name "dk14"
          git add releases/doomsday-unified-bundle*.zip releases/UNIFIED_DOCS.md
          git diff-index --quiet HEAD || git commit -m "Update unified bundles - $(date +%Y-%m-%d\ %H:%M:%S)"
          git push
